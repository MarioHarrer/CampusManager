<div class="football-page">

  <!-- Tabelle -->
  <app-football-leaderboard
    [standings]="standings()"
    title="Premier League"
  ></app-football-leaderboard>

  <!-- Match-Sektion mit Tabs -->
  <section class="matches-section">
    <div class="tabs">
      <button
        class="tab"
        [class.active]="activeTab === 'today'"
        (click)="setTab('today')"
      >
        Heutige Spiele
        <span class="count" *ngIf="todayMatches().length">{{ todayMatches().length }}</span>
      </button>
      <button
        class="tab"
        [class.active]="activeTab === 'recent'"
        (click)="setTab('recent')"
      >
        Letzte Ergebnisse
      </button>
    </div>

    <!-- Heutige Spiele -->
    <div class="match-grid" *ngIf="activeTab === 'today'">
      <ng-container *ngIf="todayMatches().length > 0; else noToday">
        <app-football-view
          *ngFor="let m of todayMatches()"
          [match]="m"
        ></app-football-view>
      </ng-container>
      <ng-template #noToday>
        <div class="empty-state">Heute finden keine Spiele statt.</div>
      </ng-template>
    </div>

    <!-- Letzte Ergebnisse -->
    <div class="match-grid" *ngIf="activeTab === 'recent'">
      <app-football-view
        *ngFor="let m of recentMatches()"
        [match]="m"
      ></app-football-view>
    </div>
  </section>
</div>
