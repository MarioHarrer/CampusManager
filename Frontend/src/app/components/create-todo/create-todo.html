<div class="todo-card">
  <h3>Add ToDo</h3>

  <div class="input-group">
    <label>Modul/Name</label>
    <input
      type="text"
      [(ngModel)]="todo.name"
      name="name"
      placeholder="z.B. Mathe-Hausübung"
    />
  </div>

  <div class="input-group">
    <label>Datum</label>
    <input type="date" [(ngModel)]="todo.date" name="date" />
  </div>

  <div class="input-group">
    <label>Beschreibung</label>
    <textarea
      [(ngModel)]="todo.description"
      name="description"
      rows="5"
      placeholder="Description"
    ></textarea>
  </div>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="form-footer">
    <button class="btn-cancel" routerLink="/calender">Cancel</button>
    <button class="btn-save" (click)="save()" [disabled]="saving">
      {{ saving ? 'Speichert…' : 'Add' }}
    </button>
  </div>
</div>
